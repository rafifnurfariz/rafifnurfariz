name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Add smooth entrance animation
        run: |
          python3 - <<'EOF'
          import glob
          css = "<style>.pac-in{opacity:0;transform:translateY(8px);animation:pacIn .7s cubic-bezier(.22,1,.36,1) .15s forwards}@keyframes pacIn{to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.pac-in{animation:none;opacity:1;transform:none}}</style><g class=\"pac-in\">"
          for p in glob.glob("dist/*.svg"):
              s = open(p, encoding="utf-8").read()
              if "pac-in" not in s:
                  s = s.replace(">", ">" + css, 1)
                  i = s.rfind("</svg>")
                  if i != -1:
                      s = s[:i] + "</g>" + s[i:]
                  open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Push SVGs to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "rafifnurfariz"
          git config user.email "mochrafif9@gmail.com"
          git add .
          git commit -m "chore: update pacman contribution graph [skip ci]"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin output
