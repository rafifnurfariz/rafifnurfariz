name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Apply GitHub Blue CRT theme and entrance animation
        run: python src/theme_pacman.py dist

      - name: Push SVGs to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "rafifnurfariz"
          git config user.email "mochrafif9@gmail.com"
          git add .
          git commit -m "chore: update blue pacman contribution graph [skip ci]"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin output
