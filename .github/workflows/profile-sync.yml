name: Sync GitHub Blue CRT Profile Telemetry

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python src/sync_profile.py "$REPO_OWNER"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "rafifnurfariz"
          git config user.email "mochrafif9@gmail.com"
          git add media/svg/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync crt telemetry [skip ci]"
            git push
          fi
