name: Sync CRT Amber Profile Telemetry

on:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python src/sync_profile.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "rafifnurfariz"
          git config user.email "mochrafif9@gmail.com"
          git add media/svg/*.svg
          git diff --staged --quiet || git commit -m "chore: sync crt amber telemetry [skip ci]"
          git push
