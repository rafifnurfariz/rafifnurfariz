<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<style>
text{font-family:'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',ui-monospace,monospace}
.bar-t{font-size:11.5px;font-weight:700;fill:#ffb000;letter-spacing:0.4px}
.bar-r{font-size:10.5px;fill:#cc8800;letter-spacing:0.4px}
.tty-h{font-size:12px;fill:#cc8800}
.prm{font-size:13px;font-weight:700;fill:#ffb000}
.cmd{font-size:13px;fill:#ffd54f}
.asc{font-size:11.5px;white-space:pre}
.nh{font-size:14px;font-weight:700;fill:#ffd54f}
.nk{font-size:12.5px;font-weight:700;fill:#ffb000}
.nd{font-size:12.5px;fill:#7a5200}
.nv{font-size:12.5px;fill:#ffe8a3}
.note{font-size:12px;fill:#cc8800}
.shell-in{opacity:0.65;transform:translateY(4px);animation:card-in 0.35s cubic-bezier(.16,1,.3,1) forwards}
.asc-glow{animation:crt-breathe 3.4s ease-in-out infinite}
.note-in{opacity:0.25;animation:note-show 0.3s ease 0.38s forwards}
.led{animation:led-pulse 2.2s ease-in-out infinite}
.cur-blink{animation:cur-flash 1.05s steps(1,end) infinite}
.nl0{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.060s forwards}.nl1{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.105s forwards}.nl2{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.150s forwards}.nl3{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.195s forwards}.nl4{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.240s forwards}.nl5{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.285s forwards}.nl6{opacity:0.25;transform:translateX(-6px);animation:row-in 0.28s cubic-bezier(.16,1,.3,1) 0.330s forwards}
@keyframes card-in{to{opacity:1;transform:none}}
@keyframes row-in{to{opacity:1;transform:none}}
@keyframes note-show{to{opacity:1}}
@keyframes crt-breathe{0%,100%{opacity:1}50%{opacity:0.84}}
@keyframes led-pulse{0%,100%{opacity:1}50%{opacity:0.42}}
@keyframes cur-flash{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.shell-in,.asc-glow,.note-in,.led,.cur-blink,.nl0,.nl1,.nl2,.nl3,.nl4,.nl5,.nl6{animation:none;opacity:1;transform:none}}
</style>
