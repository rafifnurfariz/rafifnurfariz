<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<style>
text{font-family:'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',ui-monospace,monospace}
.bar-t{font-size:11.5px;font-weight:700;fill:#ffb000;letter-spacing:0.4px}
.bar-r{font-size:10.5px;fill:#cc8800;letter-spacing:0.4px}
.b-head{font-size:13.5px;font-weight:700;fill:#ffd54f}
.b-sub{font-size:12px;fill:#cc8800}
.b-txt{font-size:12.5px;fill:#ffe8a3}
.ok{font-size:12px;font-weight:700;fill:#ffd54f}
.tty-h{font-size:12px;fill:#cc8800}
.prm{font-size:13px;font-weight:700;fill:#ffb000}
.cmd{font-size:13px;fill:#ffd54f}
.asc{font-size:11.5px;white-space:pre}
.nh{font-size:14px;font-weight:700;fill:#ffd54f}
.nk{font-size:12.5px;font-weight:700;fill:#ffb000}
.nd{font-size:12.5px;fill:#7a5200}
.nv{font-size:12.5px;fill:#ffe8a3}
.note{font-size:12px;fill:#cc8800}
.led{animation:led-pulse 2.2s ease-in-out infinite}
.cur-blink{animation:cur-flash 1.05s steps(1,end) infinite}
.bios-phase{animation:bios-exit 0.20s ease 1.10s forwards}
.tty-phase{opacity:0;animation:fade-in 0.20s ease 1.22s forwards}
.mem-fill{transform-origin:274px 167px;transform:scaleX(0.05);animation:mem-load 0.55s ease 0.15s forwards}
.cmd-clip-rect{transform-origin:0 0;transform:scaleX(0);animation:cmd-type 0.35s steps(6,end) 1.28s forwards}
.type-cur{opacity:0;animation:cur-slide 0.40s steps(6,end) 1.26s forwards}
.bio-note{opacity:0;animation:row-in 0.22s ease 2.00s forwards}
.bl1{opacity:0;animation:fade-in 0.12s ease 0.15s forwards}.bl2{opacity:0;animation:fade-in 0.12s ease 0.35s forwards}.bl3{opacity:0;animation:fade-in 0.12s ease 0.55s forwards}
.nl0{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.55s forwards}.nl1{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.61s forwards}.nl2{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.67s forwards}.nl3{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.73s forwards}.nl4{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.79s forwards}.nl5{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.85s forwards}.nl6{opacity:0;transform:translateY(3px);animation:row-in 0.22s ease 1.91s forwards}
@keyframes fade-in{to{opacity:1}}
@keyframes row-in{to{opacity:1;transform:none}}
@keyframes bios-exit{to{opacity:0;visibility:hidden}}
@keyframes mem-load{to{transform:scaleX(1)}}
@keyframes cmd-type{to{transform:scaleX(1)}}
@keyframes cur-slide{0%{opacity:1;transform:translateX(0)}92%{opacity:1;transform:translateX(49px)}100%{opacity:0;transform:translateX(49px)}}
@keyframes led-pulse{0%,100%{opacity:1}50%{opacity:0.42}}
@keyframes cur-flash{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .bios-phase{display:none}
  .tty-phase,.bio-note,.nl0,.nl1,.nl2,.nl3,.nl4,.nl5,.nl6{animation:none;opacity:1;transform:none}
  .cmd-clip-rect{animation:none;transform:scaleX(1)}
  .type-cur{display:none}
  .led,.cur-blink{animation:none;opacity:1}
}
</style>
<defs><pattern id="bios-scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" fill-opacity="0.22"/></pattern><radialGradient id="bios-vig" cx="50%" cy="48%" r="65%"><stop offset="0%" stop-color="#ffb000" stop-opacity="0.06"/><stop offset="72%" stop-color="#121212" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0.45"/></radialGradient><filter id="bios-glow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="1.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="bios-scr"><rect x="12" y="12" width="836" height="396" rx="9"/></clipPath><clipPath id="bios-cmd-clip"><g transform="translate(219,101)"><rect x="0" y="0" width="49" height="24" class="cmd-clip-rect"/></g></clipPath></defs>
