<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<style>
text{font-family:'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',ui-monospace,monospace}
.bar-t{font-size:11.5px;font-weight:700;fill:#58a6ff;letter-spacing:0.4px}
.bar-r{font-size:10.5px;fill:#7da5d8;letter-spacing:0.4px}
.tty-h{font-size:12px;fill:#7da5d8}
.prm{font-size:13px;font-weight:700;fill:#58a6ff}
.cmd{font-size:13px;fill:#79c0ff}
.asc{font-size:11.5px;white-space:pre}
.nh{font-size:14px;font-weight:700;fill:#79c0ff}
.nk{font-size:12.5px;font-weight:700;fill:#58a6ff}
.nd{font-size:12.5px;fill:#388bfd}
.nv{font-size:12.5px;fill:#e6edf3}
.note{font-size:12px;fill:#7da5d8}
.hdr-in{opacity:0;transform:translateY(6px);animation:card-in 0.50s cubic-bezier(.16,1,.3,1) 0.05s forwards}
.asc-in{opacity:0;transform:translateY(8px);animation:card-in 0.60s cubic-bezier(.16,1,.3,1) 0.15s forwards}
.asc-glow{animation:crt-breathe 3.4s ease-in-out 0.8s infinite}
.note-in{opacity:0;transform:translateX(-8px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.92s forwards}
.led{animation:led-pulse 2.2s ease-in-out infinite}
.cur-blink{animation:cur-flash 1.05s steps(1,end) infinite}
.nl0{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.25s forwards}.nl1{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.34s forwards}.nl2{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.43s forwards}.nl3{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.52s forwards}.nl4{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.61s forwards}.nl5{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.70s forwards}.nl6{opacity:0;transform:translateX(-10px);animation:row-in 0.50s cubic-bezier(.16,1,.3,1) 0.79s forwards}
@keyframes card-in{to{opacity:1;transform:none}}
@keyframes row-in{to{opacity:1;transform:none}}
@keyframes crt-breathe{0%,100%{opacity:1}50%{opacity:0.84}}
@keyframes led-pulse{0%,100%{opacity:1}50%{opacity:0.42}}
@keyframes cur-flash{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hdr-in,.asc-in,.asc-glow,.note-in,.led,.cur-blink,.nl0,.nl1,.nl2,.nl3,.nl4,.nl5,.nl6{animation:none;opacity:1;transform:none}}
</style>
<defs><pattern id="bios-scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" fill-opacity="0.20"/></pattern><radialGradient id="bios-vig" cx="50%" cy="48%" r="65%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0.06"/><stop offset="72%" stop-color="#0d1117" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0.40"/></radialGradient><filter id="bios-glow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="1.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="bios-scr"><rect x="12" y="12" width="836" height="396" rx="9"/></clipPath></defs>
