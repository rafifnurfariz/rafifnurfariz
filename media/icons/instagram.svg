<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
<style>
.g{transform-origin:center;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards,float 3.6s ease-in-out .5s infinite}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
</style>
<defs>
<linearGradient id="ig" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#feda75"/>
<stop offset="25%" stop-color="#fa7e1e"/>
<stop offset="50%" stop-color="#d62976"/>
<stop offset="75%" stop-color="#962fbf"/>
<stop offset="100%" stop-color="#4f5bd5"/>
</linearGradient>
</defs>
<g class="g">
<rect x="2" y="2" width="20" height="20" rx="5.5" stroke="url(#ig)" stroke-width="2"/>
<circle cx="12" cy="12" r="4.2" stroke="url(#ig)" stroke-width="2"/>
<circle cx="17.3" cy="6.7" r="1.25" fill="url(#ig)"/>
</g>
</svg>
